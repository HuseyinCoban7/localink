server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/localink
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true

jwt:
  secret: "bu-cumleyi-uzun-ve-guclu-bir-secret-ile-degistir"
  expiration-ms: 3600000          # access token 1 saat
  refresh-expiration-ms: 1209600000 # refresh token 14 gün

logging:
  level:
    org.springframework.security: INFO
